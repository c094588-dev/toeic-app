<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語学習アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <style>
    .slide-out-left  { animation: slideOutLeft  0.18s ease-in forwards; }
    .slide-out-right { animation: slideOutRight 0.18s ease-in forwards; }
    .slide-in-left   { animation: slideInLeft   0.18s ease-out forwards; }
    .slide-in-right  { animation: slideInRight  0.18s ease-out forwards; }
    @keyframes slideOutLeft  { to { transform: translateX(-100%); opacity: 0; } }
    @keyframes slideOutRight { to { transform: translateX( 100%); opacity: 0; } }
    @keyframes slideInLeft   { from { transform: translateX( 100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight  { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex flex-col transition-colors duration-300">

  <!-- ヘッダー -->
  <header class="flex justify-between items-center px-4 py-3 bg-white dark:bg-gray-800 border-b dark:border-gray-700 shadow-sm">
    <h1 class="text-lg font-bold dark:text-white">英単語学習</h1>
    <div class="flex items-center gap-2">
      <button id="quizBtn" class="px-3 py-1 rounded-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-semibold transition">📝 4択クイズ</button>
      <button id="toggleTheme" class="text-xl px-2">🌙</button>
    </div>
  </header>

  <!-- フィルターバー（スコアバンド） -->
  <div class="bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700 overflow-x-auto">
    <div id="bandFilters" class="flex gap-2 px-4 py-2 min-w-max">
      <button class="band-chip selected" data-band="">全て</button>
    </div>
  </div>

  <!-- フィルターバー（学習状況） -->
  <div class="bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700">
    <div class="flex gap-2 px-4 py-2">
      <button class="status-chip selected" data-status="">全て</button>
      <button class="status-chip" data-status="unstudied">未学習</button>
      <button class="status-chip" data-status="notyet" style="--chip-color: #f97316;">まだ</button>
      <button class="status-chip" data-status="mastered" style="--chip-color: #22c55e;">覚えた</button>
    </div>
  </div>

  <!-- 進捗 -->
  <div class="flex justify-between items-center px-4 pt-3 text-sm text-gray-500 dark:text-gray-400">
    <span id="progress">0 / 0</span>
    <div class="flex gap-4">
      <span><span id="masteredCount" class="font-semibold text-green-500">0</span> 覚えた</span>
      <span><span id="notYetCount"   class="font-semibold text-orange-500">0</span> まだ</span>
    </div>
  </div>

  <!-- カードエリア -->
  <main class="flex-grow flex items-center justify-center px-4 py-4 overflow-hidden">
    <div id="cardWrapper" class="w-full max-w-md">
      <div id="card" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">

        <!-- バッジ行 -->
        <div class="flex justify-between items-center px-5 pt-5">
          <span id="bandBadge" class="text-xs px-3 py-1 rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300"></span>
          <span id="importanceBadge" class="text-xs px-3 py-1 rounded-full"></span>
        </div>

        <!-- 英単語 -->
        <div class="flex items-center justify-center px-6 py-10">
          <p id="word" class="text-4xl font-bold text-center dark:text-white">Loading...</p>
        </div>

        <hr class="dark:border-gray-700 mx-5">

        <!-- 意味エリア（非表示→表示） -->
        <div id="meaningArea" class="hidden px-5 pt-4 pb-2 text-center">
          <p id="meaning" class="text-xl font-semibold dark:text-white"></p>
          <p id="example" class="mt-2 text-sm text-gray-500 dark:text-gray-400 italic"></p>
        </div>

        <!-- ボタンエリア -->
        <div id="revealArea" class="px-5 py-5">
          <button id="showBtn" class="w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold transition">
            意味を表示
          </button>
        </div>

        <div id="markArea" class="hidden px-5 pb-5 flex gap-3">
          <button id="notYetBtn" class="flex-1 py-3 rounded-xl bg-orange-100 hover:bg-orange-200 text-orange-600 font-semibold transition flex items-center justify-center gap-2">
            ↺ まだ
          </button>
          <button id="masteredBtn" class="flex-1 py-3 rounded-xl bg-green-100 hover:bg-green-200 text-green-600 font-semibold transition flex items-center justify-center gap-2">
            ✓ 覚えた
          </button>
        </div>

      </div>

      <!-- 単語なし -->
      <div id="emptyState" class="hidden text-center py-16 text-gray-400 dark:text-gray-500">
        <div class="text-5xl mb-3">✅</div>
        <p>このフィルターの単語はありません</p>
      </div>
    </div>
  </main>

  <!-- ナビゲーション -->
  <footer class="px-4 pb-8 pt-2">
    <div class="flex gap-3 max-w-md mx-auto">
      <button id="prevBtn" class="nav-btn">
        <span class="text-xl">←</span>
        <span class="text-xs">前へ</span>
      </button>
      <button id="shuffleBtn" class="nav-btn">
        <span class="text-xl">⇄</span>
        <span class="text-xs">ランダム</span>
      </button>
      <button id="nextBtn" class="nav-btn">
        <span class="text-xl">→</span>
        <span class="text-xs">次へ</span>
      </button>
    </div>
  </footer>

  <!-- 4択クイズ（全画面） -->
  <section id="quizView" class="hidden fixed inset-0 z-10 bg-gray-100 dark:bg-gray-900 flex flex-col" style="padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);">
    <header class="flex justify-between items-center px-4 py-3 bg-white dark:bg-gray-800 border-b dark:border-gray-700 shadow-sm">
      <button id="quizCloseBtn" class="text-blue-500 text-sm font-semibold">← 戻る</button>
      <h2 id="quizTitle" class="text-base font-bold dark:text-white">4択クイズ</h2>
      <span class="w-12"></span>
    </header>

    <!-- 問題 -->
    <div id="quizQuestion" class="flex-grow flex flex-col w-full max-w-md mx-auto px-4 py-4">
      <div class="flex justify-between text-sm text-gray-500 dark:text-gray-400">
        <span id="quizProgress">1 / 10</span>
        <span class="font-semibold text-green-500">正解 <span id="quizCorrect">0</span></span>
      </div>
      <div class="h-1.5 mt-2 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden">
        <div id="quizBar" class="h-full bg-blue-500 transition-all" style="width:0%"></div>
      </div>

      <div class="flex-grow flex flex-col items-center justify-center py-6">
        <div class="flex items-center gap-3">
          <p id="quizWord" class="text-4xl font-bold text-center dark:text-white"></p>
          <button id="quizSpeak" class="text-2xl" aria-label="発音を聞く">🔊</button>
        </div>
        <p id="quizExample" class="hidden mt-4 text-sm text-gray-500 dark:text-gray-400 italic text-center"></p>
      </div>

      <div id="quizChoices" class="flex flex-col gap-2"></div>

      <button id="quizNextBtn" class="invisible mt-4 w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold transition">次へ</button>
    </div>

    <!-- 結果 -->
    <div id="quizResult" class="hidden flex-grow overflow-y-auto w-full max-w-md mx-auto px-4 py-6">
      <div class="text-center">
        <p id="quizScore" class="text-5xl font-bold dark:text-white"></p>
        <p id="quizMessage" class="mt-2 text-gray-500 dark:text-gray-400"></p>
      </div>
      <div id="quizWrongArea" class="mt-6">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2">間違えた単語（「まだ」に追加しました）</p>
        <ul id="quizWrongList" class="bg-white dark:bg-gray-800 rounded-xl divide-y dark:divide-gray-700"></ul>
      </div>
      <div class="mt-6 flex flex-col gap-2">
        <button id="quizRetryBtn" class="w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold transition">もう一度挑戦する</button>
        <button id="quizBackBtn" class="w-full py-3 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold transition">戻る</button>
      </div>
    </div>
  </section>

  <style>
    .quiz-choice {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .dark .quiz-choice { background: #1f2937; color: #f3f4f6; }
    .quiz-choice.correct { background: #22c55e; color: white; }
    .quiz-choice.wrong   { background: #ef4444; color: white; }
    .quiz-choice.dim     { opacity: 0.5; }
    .band-chip, .status-chip {
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.875rem;
      background: #e5e7eb;
      color: #374151;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .dark .band-chip, .dark .status-chip {
      background: #374151;
      color: #d1d5db;
    }
    .band-chip.selected {
      background: #3b82f6;
      color: white;
    }
    .status-chip.selected {
      background: var(--chip-color, #3b82f6);
      color: white;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      border-radius: 14px;
      background: #e5e7eb;
      color: #374151;
      transition: background 0.15s;
    }
    .dark .nav-btn {
      background: #374151;
      color: #d1d5db;
    }
    .nav-btn:hover { background: #d1d5db; }
    .dark .nav-btn:hover { background: #4b5563; }
  </style>

  <script>
    // ---- 状態 ----
    let allWords = [];
    let currentIndex = 0;
    let selectedBand = '';
    let selectedStatus = '';
    // localStorage が使えない環境（プライベートブラウズ等）でも動くようにする
    const storage = {
      get(key) { try { return localStorage.getItem(key); } catch { return null; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch {} },
    };
    const loadIds = key => { try { return new Set(JSON.parse(storage.get(key) || '[]')); } catch { return new Set(); } };
    let masteredIds = loadIds('masteredIds');
    let notYetIds   = loadIds('notYetIds');

    // ---- フィルター適用 ----
    function filteredWords() {
      return allWords.filter(w => {
        if (selectedBand && String(w.score_band) !== selectedBand) return false;
        const status = wordStatus(w.No);
        if (selectedStatus === 'unstudied' && status !== 'unstudied') return false;
        if (selectedStatus === 'notyet'    && status !== 'notyet')    return false;
        if (selectedStatus === 'mastered'  && status !== 'mastered')  return false;
        return true;
      });
    }

    function wordStatus(id) {
      if (masteredIds.has(id)) return 'mastered';
      if (notYetIds.has(id))   return 'notyet';
      return 'unstudied';
    }

    // ---- 保存 ----
    function saveStatus() {
      storage.set('masteredIds', JSON.stringify([...masteredIds]));
      storage.set('notYetIds',   JSON.stringify([...notYetIds]));
    }

    // ---- 表示 ----
    function renderCard(animate) {
      const words = filteredWords();
      const card = document.getElementById('card');
      const empty = document.getElementById('emptyState');

      updateStats();

      if (words.length === 0) {
        card.classList.add('hidden');
        empty.classList.remove('hidden');
        document.getElementById('progress').textContent = '0 / 0';
        return;
      }

      card.classList.remove('hidden');
      empty.classList.add('hidden');

      if (currentIndex >= words.length) currentIndex = words.length - 1;
      const w = words[currentIndex];

      document.getElementById('progress').textContent = `${currentIndex + 1} / ${words.length}`;
      document.getElementById('word').textContent = w.word;
      document.getElementById('meaning').textContent = w.meaning;
      document.getElementById('example').textContent = w.example;

      // バッジ
      const bandBadge = document.getElementById('bandBadge');
      bandBadge.textContent = `TOEIC ${w.score_band}`;
      const bandColors = { 500:'bg-green-100 text-green-600', 600:'bg-blue-100 text-blue-600', 700:'bg-orange-100 text-orange-600', 800:'bg-purple-100 text-purple-600' };
      bandBadge.className = `text-xs px-3 py-1 rounded-full ${bandColors[w.score_band] || 'bg-red-100 text-red-600'}`;

      const impBadge = document.getElementById('importanceBadge');
      impBadge.textContent = w.importance;
      impBadge.className = `text-xs px-3 py-1 rounded-full ${w.importance === '必須' ? 'bg-red-100 text-red-500' : w.importance === '重要' ? 'bg-orange-100 text-orange-500' : 'bg-gray-100 text-gray-500'}`;

      // 意味を隠す
      hideReveal();

      if (animate) {
        const wrapper = document.getElementById('cardWrapper');
        wrapper.classList.add(animate === 'forward' ? 'slide-in-left' : 'slide-in-right');
        wrapper.addEventListener('animationend', () => {
          wrapper.classList.remove('slide-in-left', 'slide-in-right');
        }, { once: true });
      }
    }

    function hideReveal() {
      document.getElementById('meaningArea').classList.add('hidden');
      document.getElementById('revealArea').classList.remove('hidden');
      document.getElementById('markArea').classList.add('hidden');
      document.getElementById('markArea').classList.remove('flex');
    }

    function updateStats() {
      document.getElementById('masteredCount').textContent = masteredIds.size;
      document.getElementById('notYetCount').textContent   = notYetIds.size;
    }

    function slideAndGo(direction, callback) {
      const wrapper = document.getElementById('cardWrapper');
      wrapper.classList.add(direction === 'forward' ? 'slide-out-left' : 'slide-out-right');
      wrapper.addEventListener('animationend', () => {
        wrapper.classList.remove('slide-out-left', 'slide-out-right');
        callback();
        renderCard(direction);
      }, { once: true });
    }

    // ---- ボタン操作 ----
    document.getElementById('showBtn').addEventListener('click', () => {
      document.getElementById('meaningArea').classList.remove('hidden');
      document.getElementById('revealArea').classList.add('hidden');
      document.getElementById('markArea').classList.remove('hidden');
      document.getElementById('markArea').classList.add('flex');
    });

    document.getElementById('masteredBtn').addEventListener('click', () => {
      const words = filteredWords();
      if (!words.length) return;
      const id = words[currentIndex].No;
      slideAndGo('forward', () => {
        masteredIds.add(id);
        notYetIds.delete(id);
        saveStatus();
        const newWords = filteredWords();
        if (currentIndex >= newWords.length) currentIndex = Math.max(0, newWords.length - 1);
        else currentIndex = Math.min(currentIndex + 1, newWords.length - 1);
      });
    });

    document.getElementById('notYetBtn').addEventListener('click', () => {
      const words = filteredWords();
      if (!words.length) return;
      const id = words[currentIndex].No;
      slideAndGo('forward', () => {
        notYetIds.add(id);
        masteredIds.delete(id);
        saveStatus();
        const newWords = filteredWords();
        if (currentIndex >= newWords.length) currentIndex = Math.max(0, newWords.length - 1);
        else currentIndex = Math.min(currentIndex + 1, newWords.length - 1);
      });
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      slideAndGo('forward', () => {
        const words = filteredWords();
        if (words.length) currentIndex = (currentIndex + 1) % words.length;
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      slideAndGo('backward', () => {
        const words = filteredWords();
        if (words.length) currentIndex = (currentIndex - 1 + words.length) % words.length;
      });
    });

    document.getElementById('shuffleBtn').addEventListener('click', () => {
      slideAndGo('forward', () => {
        const words = filteredWords();
        if (words.length > 1) {
          let next;
          do { next = Math.floor(Math.random() * words.length); } while (next === currentIndex);
          currentIndex = next;
        }
      });
    });

    // ---- スコアバンドフィルター ----
    function buildBandFilters() {
      const bands = [...new Set(allWords.map(w => w.score_band))].sort((a,b) => a-b);
      const container = document.getElementById('bandFilters');
      bands.forEach(band => {
        const btn = document.createElement('button');
        btn.className = 'band-chip';
        btn.dataset.band = band;
        btn.textContent = `${band}点`;
        container.appendChild(btn);
      });
      container.addEventListener('click', e => {
        const chip = e.target.closest('.band-chip');
        if (!chip) return;
        selectedBand = chip.dataset.band;
        container.querySelectorAll('.band-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        currentIndex = 0;
        renderCard(null);
      });
    }

    // ---- 学習状況フィルター ----
    document.querySelectorAll('.status-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedStatus = chip.dataset.status;
        document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        currentIndex = 0;
        renderCard(null);
      });
    });

    // ---- ダークモード ----
    let isDark = storage.get('theme') === 'dark' ||
      (!storage.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

    function applyTheme() {
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('toggleTheme').textContent = isDark ? '☀️' : '🌙';
    }
    applyTheme();
    document.getElementById('toggleTheme').addEventListener('click', () => {
      isDark = !isDark;
      storage.set('theme', isDark ? 'dark' : 'light');
      applyTheme();
    });

    // ---- スワイプ ----
    let touchStartX = 0;
    document.getElementById('cardWrapper').addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    });
    document.getElementById('cardWrapper').addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) < 60) return;
      if (diff < 0) {
        slideAndGo('forward', () => {
          const words = filteredWords();
          if (words.length) currentIndex = (currentIndex + 1) % words.length;
        });
      } else {
        slideAndGo('backward', () => {
          const words = filteredWords();
          if (words.length) currentIndex = (currentIndex - 1 + words.length) % words.length;
        });
      }
    });

    // ---- 4択クイズ ----
    const QUIZ_COUNT = 10;
    let quiz = [];
    let quizIndex = 0;
    let quizCorrect = 0;
    let quizWrong = [];
    let quizAnswered = false;

    const shuffle = arr => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    // 選択中のレベルから出題。覚えていない単語を優先する
    function makeQuiz() {
      const pool = allWords.filter(w => !selectedBand || String(w.score_band) === selectedBand);
      const unmastered = shuffle(pool.filter(w => !masteredIds.has(w.No)));
      const mastered   = shuffle(pool.filter(w =>  masteredIds.has(w.No)));
      const targets = shuffle([...unmastered, ...mastered].slice(0, QUIZ_COUNT));

      return targets.map(word => {
        // 選択肢は同じレベルから。正解と同じ意味・重複した意味は除く
        const sameBand = allWords.filter(w => w.score_band === word.score_band);
        const distractors = [];
        for (const c of shuffle(sameBand)) {
          if (c.meaning !== word.meaning && !distractors.includes(c.meaning)) distractors.push(c.meaning);
          if (distractors.length === 3) break;
        }
        if (distractors.length < 3) return null;
        const choices = shuffle([...distractors, word.meaning]);
        return { word, choices, correctIndex: choices.indexOf(word.meaning) };
      }).filter(Boolean);
    }

    function startQuiz() {
      quiz = makeQuiz();
      quizIndex = 0;
      quizCorrect = 0;
      quizWrong = [];
      document.getElementById('quizTitle').textContent =
        selectedBand ? `TOEIC ${selectedBand}点 クイズ` : '4択クイズ（全レベル）';
      document.getElementById('quizView').classList.remove('hidden');
      document.getElementById('quizResult').classList.add('hidden');
      document.getElementById('quizQuestion').classList.remove('hidden');
      renderQuestion();
    }

    function closeQuiz() {
      document.getElementById('quizView').classList.add('hidden');
      renderCard(null);
    }

    function renderQuestion() {
      const q = quiz[quizIndex];
      quizAnswered = false;
      document.getElementById('quizProgress').textContent = `${quizIndex + 1} / ${quiz.length}`;
      document.getElementById('quizCorrect').textContent = quizCorrect;
      document.getElementById('quizBar').style.width = `${quizIndex / quiz.length * 100}%`;
      document.getElementById('quizWord').textContent = q.word.word;
      const ex = document.getElementById('quizExample');
      ex.textContent = q.word.example;
      ex.classList.add('hidden');

      const box = document.getElementById('quizChoices');
      box.innerHTML = '';
      q.choices.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-choice';
        btn.textContent = text;
        btn.addEventListener('click', () => answerQuiz(i));
        box.appendChild(btn);
      });

      const next = document.getElementById('quizNextBtn');
      next.classList.add('invisible');
      next.textContent = quizIndex + 1 === quiz.length ? '結果を見る' : '次へ';
    }

    function answerQuiz(choice) {
      if (quizAnswered) return;
      quizAnswered = true;
      const q = quiz[quizIndex];
      const buttons = document.querySelectorAll('#quizChoices .quiz-choice');
      buttons.forEach((b, i) => {
        if (i === q.correctIndex) { b.classList.add('correct'); b.textContent = '✓ ' + b.textContent; }
        else if (i === choice)    { b.classList.add('wrong');   b.textContent = '✕ ' + b.textContent; }
        else                        b.classList.add('dim');
      });

      if (choice === q.correctIndex) {
        quizCorrect++;
      } else {
        quizWrong.push(q.word);
        notYetIds.add(q.word.No);
        masteredIds.delete(q.word.No);
        saveStatus();
      }
      document.getElementById('quizCorrect').textContent = quizCorrect;
      document.getElementById('quizExample').classList.remove('hidden');
      document.getElementById('quizNextBtn').classList.remove('invisible');
    }

    function showQuizResult() {
      document.getElementById('quizQuestion').classList.add('hidden');
      document.getElementById('quizResult').classList.remove('hidden');
      document.getElementById('quizScore').textContent = `${quizCorrect} / ${quiz.length}`;
      const rate = quizCorrect / Math.max(quiz.length, 1);
      document.getElementById('quizMessage').textContent =
        rate === 1 ? '全問正解！' : rate >= 0.8 ? 'よくできました' : rate >= 0.5 ? 'あと少し！' : 'フラッシュカードで復習しよう';

      const list = document.getElementById('quizWrongList');
      list.innerHTML = '';
      quizWrong.forEach(w => {
        const li = document.createElement('li');
        li.className = 'flex justify-between gap-4 px-4 py-3 text-sm';
        const en = document.createElement('span');
        en.className = 'font-semibold dark:text-white';
        en.textContent = w.word;
        const ja = document.createElement('span');
        ja.className = 'text-gray-500 dark:text-gray-400 text-right';
        ja.textContent = w.meaning;
        li.append(en, ja);
        list.appendChild(li);
      });
      document.getElementById('quizWrongArea').classList.toggle('hidden', quizWrong.length === 0);
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    document.getElementById('quizBtn').addEventListener('click', startQuiz);
    document.getElementById('quizCloseBtn').addEventListener('click', closeQuiz);
    document.getElementById('quizBackBtn').addEventListener('click', closeQuiz);
    document.getElementById('quizRetryBtn').addEventListener('click', startQuiz);
    document.getElementById('quizSpeak').addEventListener('click', () => speak(quiz[quizIndex].word.word));
    document.getElementById('quizNextBtn').addEventListener('click', () => {
      quizIndex++;
      if (quizIndex >= quiz.length) showQuizResult();
      else renderQuestion();
    });

    // ---- データ読み込み ----
    fetch('words.json')
      .then(r => r.json())
      .then(data => {
        allWords = data;
        buildBandFilters();
        renderCard(null);
      })
      .catch(() => {
        document.getElementById('word').textContent = 'words.json を読み込めませんでした';
      });
  </script>
</body>
</html>
