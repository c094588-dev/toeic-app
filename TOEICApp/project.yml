name: TOEICApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

targets:
  TOEICApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TOEICApp
    resources:
      - path: TOEICApp/words.json
      - path: TOEICApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TOEICApp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
